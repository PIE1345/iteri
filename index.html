   ===================================================================== */
let draftSel = null;
function renderDraft(el){
  const tc = db.draft.teamCount;
  const present = db.players.filter(p => p.present);
  present.forEach(p => { if(p.team != null && (p.team < 1 || p.team > tc)) p.team = null; });
  const pool = present.filter(p => p.team == null).sort(byTierName);
  const groups = [...TIERS.map(t => ({ k:t.k, label:`${t.k} (${t.cost}코)` })), { k:null, label:'Unranked (0코)' }]
    .map(g => ({ ...g, list: pool.filter(p => (tierInfo(p.tier)?.k ?? null) === g.k) })).filter(g => g.list.length);

  let teamsHtml = '';
  for(let i=1; i<=tc; i++){
    const ms = present.filter(p => p.team === i).sort((a,b) => costOf(b) - costOf(a));
    teamsHtml += `<div class="team-card dropzone" data-drop="${i}">
      <div class="team-head"><span>${i}팀 <span class="muted small">${ms.length}명</span></span><span class="team-cost">코스트 ${ms.reduce((s,p)=>s+costOf(p),0)}</span></div>
      <div class="team-members">${ms.map(p => chip(p,{draggable:true})).join('') || '<span class="muted small">여기에 선수를 놓으세요</span>'}</div></div>`;
  }
  el.innerHTML = `
    <header class="page-header">
      <div><h2 class="page-title">팀 드래프트</h2><p class="page-sub">출근한 선수 ${present.length}명 · 팀 ${tc}개 · 선수를 드래그하거나, 선수를 누른 뒤 팀을 누르세요</p></div>
      <div class="toolbar">
        <button class="btn" id="drAdd"><i class="fa-solid fa-plus"></i> 팀 추가</button>
        <button class="btn" id="drDel"><i class="fa-solid fa-minus"></i> 팀 삭제</button>
        <button class="btn" id="drAuto"><i class="fa-solid fa-shuffle"></i> 자동 배정</button>
        <button class="btn btn-primary" id="drConfirm"><i class="fa-solid fa-check"></i> 팀 확정</button>
        <button class="btn" id="drCopy"><i class="fa-regular fa-copy"></i> 텍스트 복사</button>
        <button class="btn btn-danger" id="drReset"><i class="fa-solid fa-rotate-left"></i> 초기화</button>
      </div>
    </header>
    ${present.length === 0 ? `<div class="card">${emptyBox('fa-clipboard-check','출근한 선수가 없습니다.<br>출/퇴근 관리에서 참여 선수를 출근 처리하세요.')}</div>` : `
    <div class="draft-layout">
      <div class="card pool dropzone" data-drop="">
        <h3 class="section"><i class="fa-solid fa-users"></i> 대기 선수 (${pool.length}명)</h3>
        ${groups.map(g => `<div class="tier-group-label">${tierBadge(g.k)} ${esc(g.label)}</div><div class="chips">${g.list.map(p => chip(p,{draggable:true})).join('')}</div>`).join('') || '<p class="muted small">모든 선수가 배정되었습니다</p>'}
      </div>
      <div class="teams-grid">${teamsHtml}</div>
    </div>`}`;

  const move = (pid, zone) => { const p = findPlayer(pid); if(!p) return; p.team = zone === '' ? null : Number(zone); draftSel = null; save(); rerender(); };
  bindDnD(el, move);
  // 클릭으로 배치 (터치 화면용)
  $$('.chip', el).forEach(c => {
    if(c.dataset.pid === draftSel) c.classList.add('selected');
    c.addEventListener('click', e => { e.stopPropagation(); draftSel = draftSel === c.dataset.pid ? null : c.dataset.pid; rerender(); });
  });
  $$('[data-drop]', el).forEach(z => z.addEventListener('click', () => { if(draftSel) move(draftSel, z.dataset.drop); }));

  $('#drAdd').onclick = () => { if(db.draft.teamCount >= 16) return toast('팀은 최대 16개입니다','error'); db.draft.teamCount++; save(); rerender(); };
  $('#drDel').onclick = () => {
    if(db.draft.teamCount <= 1) return;
    const n = db.draft.teamCount;
    db.players.forEach(p => { if(p.team === n) p.team = null; });
    db.draft.teamCount--; save(); rerender();
  };
  $('#drAuto').onclick = () => {
    const teams = Array.from({ length:tc }, (_,i) => ({ id:i+1, n:0, cost:0 }));
    shuffle([...present]).sort((a,b) => costOf(b) - costOf(a)).forEach(p => {
      const minN = Math.min(...teams.map(t => t.n));
      const c1 = teams.filter(t => t.n === minN);
      const minC = Math.min(...c1.map(t => t.cost));
      const c2 = c1.filter(t => t.cost === minC);
      const t = c2[Math.floor(Math.random() * c2.length)];
      p.team = t.id; t.n++; t.cost += costOf(p);
    });
    save(); rerender(); toast('코스트 균형에 맞춰 자동 배정했습니다');
  };
  $('#drReset').onclick = () => confirmDialog('모든 팀 배정을 해제할까요?', () => { db.players.forEach(p => p.team = null); save(); rerender(); }, { okLabel:'초기화', danger:true });
  $('#drCopy').onclick = () => {
    const lines = [];
    for(let i=1; i<=tc; i++){
      const ms = present.filter(p => p.team === i);
      if(ms.length) lines.push(`${i}팀 (코스트 ${ms.reduce((s,p)=>s+costOf(p),0)}): ${ms.map(p => p.name).join(', ')}`);
    }
    if(!lines.length) return toast('배정된 팀이 없습니다','error');
    copyText(lines.join('\n'));
  };
  $('#drConfirm').onclick = () => {
    const teams = [];
    for(let i=1; i<=tc; i++){
      const ms = present.filter(p => p.team === i);
      if(ms.length) teams.push({ id:i, name:`${i}팀`, members: ms.map(p => ({ pid:p.id, name:p.name })) });
    }
    if(!teams.length) return toast('배정된 팀이 없습니다','error');
    confirmDialog(`${teams.length}개 팀으로 경기 점수판을 준비합니다. 점수판의 기존 점수는 초기화됩니다.`, () => {
      Object.assign(db.score, { teams, scores:{}, startedAt:null });
      save(); location.hash = '#score'; toast('팀을 확정했습니다');
    });
  };
}
function copyText(text){
  const done = () => toast('클립보드에 복사했습니다');
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  function fallback(){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch{ toast('복사에 실패했습니다','error'); }
    ta.remove();
  }
}

/* =====================================================================
   [페이지 4] 경기 점수판 (관리자)
   - 라운드별 점수 입력 → 합계·순위 자동 계산
   - 체크포인트 룰: 목표 점수 달성 팀에 🔥 표시
   - 대회 종료 & 저장: 최종 순위를 우승 기록에 저장
   ===================================================================== */
function renderScore(el){
  const S = db.score;
  if(!S.teams.length){
    el.innerHTML = `<header class="page-header"><div><h2 class="page-title">경기 점수 & 순위</h2></div></header>
      <div class="card">${emptyBox('fa-people-group','아직 확정된 팀이 없습니다.<br>팀 드래프트에서 팀을 확정하거나, 빈 팀으로 바로 시작할 수 있습니다.')}
      <div class="toolbar" style="justify-content:center"><a class="btn" href="#draft"><i class="fa-solid fa-people-group"></i> 팀 드래프트로 이동</a>
      <button class="btn btn-primary" id="scBlank"><i class="fa-solid fa-plus"></i> 빈 팀 8개로 시작</button></div></div>`;
    $('#scBlank').onclick = () => { S.teams = Array.from({ length:8 }, (_,i) => ({ id:i+1, name:`${i+1}팀`, members:[] })); S.scores = {}; save(); rerender(); };
    return;
  }
  let head = '<th>팀명</th>';
  for(let r=1; r<=S.rounds; r++) head += `<th style="text-align:center">R${r}</th>`;
  head += '<th style="text-align:center">합계</th>';
  const rows = S.teams.map(t => {
    let cells = '';
    for(let r=1; r<=S.rounds; r++){
      const v = S.scores[t.id + '-' + r];
      cells += `<td style="text-align:center"><input class="input score-input num" type="number" step="any" data-team="${t.id}" data-round="${r}" value="${v ?? ''}" placeholder="0"></td>`;
    }
    return `<tr><td><input class="input team-name-input" data-team-name="${t.id}" value="${esc(t.name)}">
        <div class="small muted" style="margin-top:4px">${t.members.map(m => esc(memberName(m))).join(', ') || '멤버 없음'}</div></td>
      ${cells}<td style="text-align:center;font-weight:800;color:var(--accent)" class="num" id="tot-${t.id}">${teamTotal(t)}</td></tr>`;
  }).join('');

  el.innerHTML = `
    <header class="page-header">
      <div><h2 class="page-title">경기 점수 & 순위</h2><p class="page-sub">점수를 입력하면 자동 저장되고 순위가 바로 바뀝니다</p></div>
      <div class="toolbar">
        <label class="cp-toggle"><input type="checkbox" id="cpOn" ${S.cpOn?'checked':''}> 체크포인트 룰
          <input class="input num" type="number" id="cpTarget" value="${S.cpTarget}" title="목표 점수"> 점</label>
        <button class="btn" id="scAddR"><i class="fa-solid fa-plus"></i> 라운드 추가</button>
        <button class="btn" id="scDelR"><i class="fa-solid fa-minus"></i> 라운드 삭제</button>
        <button class="btn btn-danger" id="scReset"><i class="fa-solid fa-eraser"></i> 점수 초기화</button>
        <button class="btn btn-danger" id="scDelete"><i class="fa-solid fa-ban"></i> 경기 삭제</button>
        <button class="btn btn-primary" id="scEnd"><i class="fa-solid fa-flag-checkered"></i> 대회 종료 & 저장</button>
      </div>
    </header>
    <div class="score-layout">
      <div class="card"><h3 class="section"><i class="fa-solid fa-ranking-star"></i> 실시간 순위</h3><div class="tbl-wrap" id="liveRank"></div></div>
      <div class="card"><h3 class="section"><i class="fa-solid fa-pen"></i> 점수 입력 <span class="small muted">(팀 순 고정)</span></h3>
        <div class="tbl-wrap"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div></div>
    </div>`;
  drawLiveRank();

  $$('[data-round]', el).forEach(inp => inp.addEventListener('input', () => {
    const key = inp.dataset.team + '-' + inp.dataset.round;
    if(inp.value === '') delete S.scores[key]; else S.scores[key] = Number(inp.value);
    if(!S.startedAt && inp.value !== '') S.startedAt = Date.now();
    save();
    const t = S.teams.find(t => String(t.id) === inp.dataset.team);
    $('#tot-' + t.id).textContent = teamTotal(t);
    drawLiveRank();
  }));
  $$('[data-team-name]', el).forEach(inp => inp.addEventListener('change', () => {
    const t = S.teams.find(t => String(t.id) === inp.dataset.teamName);
    t.name = inp.value.trim() || `${t.id}팀`; save(); drawLiveRank();
  }));
  $('#cpOn').onchange = e => { S.cpOn = e.target.checked; save(); drawLiveRank(); };
  $('#cpTarget').onchange = e => { S.cpTarget = Number(e.target.value) || 0; save(); drawLiveRank(); };
  $('#scAddR').onclick = () => { if(S.rounds >= 20) return; S.rounds++; save(); rerender(); };
  $('#scDelR').onclick = () => {
    if(S.rounds <= 1) return;
    const r = S.rounds, has = S.teams.some(t => S.scores[t.id + '-' + r] != null);
    const doIt = () => { S.teams.forEach(t => delete S.scores[t.id + '-' + r]); S.rounds--; save(); rerender(); };
    has ? confirmDialog(`R${r}에 입력된 점수가 함께 삭제됩니다.`, doIt, { okLabel:'삭제', danger:true }) : doIt();
  };
  $('#scReset').onclick = () => confirmDialog('모든 라운드 점수를 지울까요?', () => { S.scores = {}; S.startedAt = null; save(); rerender(); }, { okLabel:'초기화', danger:true });
  $('#scEnd').onclick = openEndMatch;
  // 경기 삭제: 우승 기록에 남기지 않고 진행 중인 경기(팀 구성 + 점수)를 통째로 버립니다.
  $('#scDelete').onclick = () => confirmDialog(
    '진행 중인 경기를 삭제할까요? 점수와 점수판 팀 구성이 모두 지워지고, 우승 기록에는 아무것도 남지 않습니다. (드래프트 배정은 그대로 남습니다)',
    () => { Object.assign(S, { teams:[], scores:{}, startedAt:null }); save(); rerender(); toast('경기를 삭제했습니다'); },
    { okLabel:'경기 삭제', danger:true });
}
function drawLiveRank(){
  const S = db.score, box = $('#liveRank'); if(!box) return;
  const ranking = scoreRanking();
  box.innerHTML = `<table class="tbl"><thead><tr><th>#</th><th>팀명</th>${S.cpOn?'<th>CP</th>':''}<th>Total</th></tr></thead><tbody>
    ${ranking.map((t,i) => { const hit = S.cpOn && t.total >= S.cpTarget;
      return `<tr class="${hit?'cp-reached':''}"><td class="rank-${i+1}">${i+1}</td><td><b>${esc(t.name)}</b></td>${S.cpOn?`<td>${hit?'🔥':''}</td>`:''}<td class="num" style="font-weight:800;font-size:1.1rem">${t.total}</td></tr>`; }).join('')}
  </tbody></table>`;
}
function openEndMatch(){
  const ranking = scoreRanking();
  if(!ranking.some(t => t.total !== 0)) return toast('입력된 점수가 없습니다','error');
  const m = openModal({
    title:'<i class="fa-solid fa-flag-checkered"></i> 대회 종료 & 저장',
    body:`<label class="field">대회 이름<input class="input" id="emTitle" value="${esc((db.records.length+1)+'회차 내전')}"></label>
      <label class="field">날짜<input class="input" type="date" id="emDate" value="${todayStr()}"></label>
      <div class="notice">최종 순위: ${ranking.slice(0,8).map((t,i) => `${i+1}등 ${esc(t.name)} (${t.total})`).join(' · ')}${ranking.length>8?` 외 ${ranking.length-8}팀`:''}</div>
      <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="emClear" checked> 저장 후 점수판 비우기</label>`,
    footer:`<button class="btn" data-x>취소</button><button class="btn btn-primary" id="emSave"><i class="fa-solid fa-floppy-disk"></i> 우승 기록에 저장</button>`
  });
  $('[data-x]', m).onclick = closeModal;
  $('#emSave', m).onclick = () => {
    db.records.push({
      id:uid(), createdAt:Date.now(),
      title: $('#emTitle', m).value.trim() || '내전', date: $('#emDate', m).value || todayStr(),
      ranks: ranking.map((t,i) => ({ rank:i+1, team:t.name, members:t.members.map(x => ({...x})), score:t.total })),
    });
    if($('#emClear', m).checked){ db.score.scores = {}; db.score.startedAt = null; }
    save(); closeModal(); toast('우승 기록에 저장했습니다'); location.hash = '#fame';
  };
}

/* =====================================================================
   [페이지 5] 우승 기록 (공개 / 관리자는 1~8등 결과 작성·수정·삭제)
   ===================================================================== */
let famePage = 1; const fameOpen = new Set();
function renderFame(el){
  const admin = isAdmin(), recs = sortedRecords(), per = 6;
  const pages = Math.max(1, Math.ceil(recs.length / per));
  famePage = Math.min(Math.max(1, famePage), pages);
  const list = recs.slice((famePage-1)*per, famePage*per);

  // 최다 우승자: 등록 선수(수동 승수 포함) + 등록되지 않은 이름
  const top = db.players.map(p => ({ name:p.name, p, wins:playerStats(p).wins })).filter(x => x.wins > 0);
  const extra = {};
  db.records.forEach(r => r.ranks.filter(e => e.rank === 1).forEach(e => (e.members||[]).forEach(m => {
    if(!db.players.some(p => memberMatches(m, p))) extra[m.name] = (extra[m.name]||0) + 1;
  })));
  Object.entries(extra).forEach(([name, wins]) => top.push({ name, p:null, wins }));
  top.sort((a,b) => b.wins - a.wins || a.name.localeCompare(b.name,'ko'));

  const medal = r => r===1?'🥇':r===2?'🥈':r===3?'🥉':`${r}등`;
  const recHtml = r => {
    const w = r.ranks.find(e => e.rank === 1), open = fameOpen.has(r.id);
    return `<div class="record">
      <div class="record-head" data-toggle="${esc(r.id)}">
        <span class="crown"><i class="fa-solid fa-crown"></i></span>
        <div class="grow"><div class="record-title">${esc(r.title)} · ${esc(w?.team || '-')}</div>
          <div class="record-meta">${esc(r.date)} · ${(w?.members||[]).map(m => esc(memberName(m))).join(', ') || '멤버 정보 없음'}</div></div>
        ${w && w.score !== '' && w.score != null ? `<span class="record-score">${esc(w.score)}</span>` : ''}
        ${admin ? `<button class="icon-btn" data-edit="${esc(r.id)}" title="수정"><i class="fa-solid fa-pen"></i></button>
                   <button class="icon-btn" data-del="${esc(r.id)}" title="삭제"><i class="fa-solid fa-trash"></i></button>` : ''}
        <i class="fa-solid fa-chevron-${open?'up':'down'} muted"></i>
      </div>
      ${open ? `<div class="record-detail"><table class="tbl"><thead><tr><th>순위</th><th>팀</th><th>멤버</th><th>점수</th></tr></thead><tbody>
        ${[...r.ranks].sort((a,b) => a.rank - b.rank).map(e => `<tr><td class="rank-${e.rank}">${medal(e.rank)}</td><td><b>${esc(e.team)}</b></td>
          <td>${(e.members||[]).map(m => `<span class="name-chip">${esc(memberName(m))}</span>`).join('')}</td><td class="num">${esc(e.score ?? '')}</td></tr>`).join('')}
      </tbody></table></div>` : ''}
    </div>`;
  };

  el.innerHTML = `
    <header class="page-header">
      <div><h2 class="page-title">우승 기록</h2><p class="page-sub">역대 내전 결과 · 기록을 누르면 전체 순위가 펼쳐집니다</p></div>
      ${admin ? `<div class="toolbar"><button class="btn btn-primary" id="fmNew"><i class="fa-solid fa-plus"></i> 결과 작성</button></div>` : ''}
    </header>
    <div class="fame-layout">
      <div class="card"><h3 class="section"><i class="fa-solid fa-scroll"></i> 역대 우승 기록</h3>
        ${list.length ? list.map(recHtml).join('') : emptyBox('fa-trophy', admin ? '아직 기록이 없습니다.<br>오른쪽 위 "결과 작성"으로 1~8등 결과를 입력하세요.' : '아직 기록이 없습니다')}
        <div class="pager"><button class="btn btn-sm" id="fmPrev" ${famePage<=1?'disabled':''}>이전</button><span class="muted">${famePage} / ${pages}</span><button class="btn btn-sm" id="fmNext" ${famePage>=pages?'disabled':''}>다음</button></div>
      </div>
      <div class="card"><h3 class="section"><i class="fa-solid fa-medal"></i> 최다 우승자 랭킹 TOP 10</h3>
        <table class="tbl"><thead><tr><th>순위</th><th>선수 이름</th><th>우승 횟수</th></tr></thead><tbody>
        ${top.length ? top.slice(0,10).map((x,i) => `<tr><td class="rank-${i+1}">${i+1}</td><td><div style="display:flex;gap:10px;align-items:center">${x.p?avatar(x.p,28):''}<b>${esc(x.name)}</b></div></td><td class="num"><b>${x.wins}</b>회</td></tr>`).join('')
          : `<tr><td colspan="3">${emptyBox('fa-crown','기록 없음')}</td></tr>`}
        </tbody></table></div>
    </div>`;

  $$('[data-toggle]', el).forEach(h => h.onclick = e => {
    if(e.target.closest('[data-edit],[data-del]')) return;
    const id = h.dataset.toggle; fameOpen.has(id) ? fameOpen.delete(id) : fameOpen.add(id); rerender();
  });
  $('#fmPrev').onclick = () => { famePage--; rerender(); };
  $('#fmNext').onclick = () => { famePage++; rerender(); };
  if(admin){
    $('#fmNew').onclick = () => openRecordEditor(null);
    $$('[data-edit]', el).forEach(b => b.onclick = () => openRecordEditor(db.records.find(r => r.id === b.dataset.edit)));
    $$('[data-del]', el).forEach(b => b.onclick = () => {
      const r = db.records.find(r => r.id === b.dataset.del);
      confirmDialog(`"${r.title}" 기록을 삭제할까요? 선수 전적에서도 빠집니다.`, () => { db.records = db.records.filter(x => x !== r); save(); rerender(); }, { okLabel:'삭제', danger:true });
    });
  }
}
function openRecordEditor(rec){
  const r = rec || { date:todayStr(), title:`${db.records.length+1}회차 내전`, ranks:[] };
  let rows = '';
  for(let i=1; i<=8; i++){
    const e = r.ranks.find(e => e.rank === i) || {};
    rows += `<tr><td class="rank-label rank-${i}">${i}등</td>
      <td><input class="input" data-f="team" data-r="${i}" placeholder="${i}팀" value="${esc(e.team||'')}"></td>
      <td><input class="input" data-f="members" data-r="${i}" placeholder="멤버1, 멤버2, 멤버3" value="${esc((e.members||[]).map(memberName).join(', '))}"></td>
      <td style="width:90px"><input class="input num" type="number" step="any" data-f="score" data-r="${i}" placeholder="점수" value="${esc(e.score ?? '')}"></td></tr>`;
  }
  const m = openModal({
    wide:true, title:`<i class="fa-solid fa-crown"></i> ${rec ? '결과 수정' : '결과 작성'}`,
    body:`<div class="form-grid" style="grid-template-columns:2fr 1fr"><label class="field">대회 이름<input class="input" id="reTitle" value="${esc(r.title)}"></label>
        <label class="field">날짜<input class="input" type="date" id="reDate" value="${esc(r.date)}"></label></div>
      <div class="tbl-wrap"><table class="editor-table" style="width:100%"><thead><tr><th class="small muted">순위</th><th class="small muted" style="text-align:left">팀 이름</th><th class="small muted" style="text-align:left">멤버 (쉼표로 구분)</th><th class="small muted">점수</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div><p class="small muted">빠른 입력: 멤버 칸을 누른 뒤 아래 이름을 클릭하면 추가됩니다. 등록된 선수 이름과 같으면 개인 기록에 자동으로 반영됩니다.</p>
        <div class="helper-chips">${db.players.length ? [...db.players].sort((a,b)=>a.name.localeCompare(b.name,'ko')).map(p => `<button type="button" data-name="${esc(p.name)}">${esc(p.name)}</button>`).join('') : '<span class="small muted">등록된 선수가 없습니다</span>'}</div></div>`,
    footer:`<button class="btn" data-x>취소</button><button class="btn btn-primary" id="reSave"><i class="fa-solid fa-floppy-disk"></i> 저장</button>`
  });
  let focusMembers = $('[data-f="members"][data-r="1"]', m);
  $$('[data-f="members"]', m).forEach(i => i.addEventListener('focus', () => focusMembers = i));
  $$('[data-name]', m).forEach(b => b.onmousedown = e => {
    e.preventDefault();
    const names = focusMembers.value.split(',').map(s => s.trim()).filter(Boolean);
    if(!names.includes(b.dataset.name)) names.push(b.dataset.name);
    focusMembers.value = names.join(', '); focusMembers.focus();
  });
  $('[data-x]', m).onclick = closeModal;
  $('#reSave', m).onclick = () => {
    const ranks = [];
    for(let i=1; i<=8; i++){
      const get = f => $(`[data-f="${f}"][data-r="${i}"]`, m).value.trim();
      const team = get('team'), members = resolveMembers(get('members')), sc = get('score');
      if(!team && !members.length && sc === '') continue;
      ranks.push({ rank:i, team: team || `${i}등 팀`, members, score: sc === '' ? '' : Number(sc) });
    }
    if(!ranks.some(e => e.rank === 1)) return toast('1등 팀은 꼭 입력해야 합니다','error');
    const data = { title: $('#reTitle', m).value.trim() || '내전', date: $('#reDate', m).value || todayStr(), ranks };
    if(rec) Object.assign(rec, data); else db.records.push({ id:uid(), createdAt:Date.now(), ...data });
    const unknown = ranks.flatMap(e => e.members).filter(x => !x.pid).map(x => x.name);
    save(); closeModal(); rerender();
    toast(unknown.length ? `저장 완료 · 미등록 이름: ${[...new Set(unknown)].join(', ')}` : '저장했습니다');
  };
}

/* =====================================================================
   [페이지 6] 개인 기록 (공개 / 관리자는 승수·게임 수 추가)
   ===================================================================== */
let profileSel = null, profileQuery = '';
function renderProfile(el){
  if(profileSel && !findPlayer(profileSel)) profileSel = null;
  el.innerHTML = `
    <header class="page-header">
      <div><h2 class="page-title">개인 기록</h2><p class="page-sub">선수를 누르면 상세 전적이 보입니다</p></div>
      <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input class="input" id="pfSearch" placeholder="선수 검색..." value="${esc(profileQuery)}"></div>
    </header>
    <div class="profile-layout">
      <div class="card"><div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>#</th><th>선수</th><th>티어</th><th>총 게임</th><th>우승</th><th>승률</th><th>평균 순위</th></tr></thead>
        <tbody id="pfBody"></tbody></table></div></div>
      <div class="card profile-detail" id="pfDetail"></div>
    </div>`;
  drawProfileTable(); drawProfileDetail();
  $('#pfSearch').addEventListener('input', e => { profileQuery = e.target.value; drawProfileTable(); });
}
function drawProfileTable(){
  const q = norm(profileQuery);
  const rows = db.players.map(p => ({ p, s:playerStats(p) }))
    .filter(x => !q || norm(x.p.name).includes(q) || norm(x.p.ingame).includes(q))
    .sort((a,b) => b.s.wins - a.s.wins || b.s.rate - a.s.rate || b.s.games - a.s.games || a.p.name.localeCompare(b.p.name,'ko'));
  const body = $('#pfBody');
  body.innerHTML = rows.length ? rows.map((x,i) => `<tr class="clickable ${x.p.id===profileSel?'selected':''}" data-pid="${esc(x.p.id)}">
      <td class="muted">${i+1}</td><td><div style="display:flex;gap:10px;align-items:center">${avatar(x.p,30)}<b>${esc(x.p.name)}</b></div></td>
      <td>${tierBadge(x.p.tier)}</td><td class="num">${x.s.games}</td><td class="num"><b>${x.s.wins}</b></td>
      <td class="num">${x.s.rate.toFixed(1)}%</td><td class="num">${x.s.avg!=null?x.s.avg.toFixed(2)+'위':'-'}</td></tr>`).join('')
    : `<tr><td colspan="7">${emptyBox('fa-user', db.players.length ? '검색 결과가 없습니다' : '등록된 선수가 없습니다')}</td></tr>`;
  $$('tr[data-pid]', body).forEach(tr => tr.onclick = () => { profileSel = tr.dataset.pid; drawProfileTable(); drawProfileDetail(); });
}
function drawProfileDetail(){
  const box = $('#pfDetail'), p = profileSel && findPlayer(profileSel);
  if(!p){ box.innerHTML = emptyBox('fa-hand-pointer','왼쪽 목록에서 선수를 선택하세요'); return; }
  const s = playerStats(p), t = tierInfo(p.tier), admin = isAdmin();
  const medal = r => r===1?'🥇':r===2?'🥈':r===3?'🥉':`${r}위`;
  box.innerHTML = `
    <div class="profile-top">${avatar(p,72)}<div style="flex:1;min-width:0">
      <div class="profile-name">${esc(p.name)}</div>
      <div class="muted small" style="margin:4px 0 8px"><i class="fa-solid fa-gamepad"></i> ${esc(p.ingame || '-')}</div>
      <a class="btn btn-sm" href="${esc(recordUrl(p))}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-arrow-up-right-from-square"></i> 전적 보기</a>
      ${admin ? `<button class="btn btn-sm" id="pfEdit"><i class="fa-solid fa-pen"></i> 정보 수정</button>` : ''}
    </div></div>
    <div class="stat-grid">
      <div class="stat-box"><div class="label">티어</div><div class="value">${tierBadge(p.tier)}</div><div class="small muted" style="margin-top:4px">${t?t.cost:0}코스트</div></div>
      <div class="stat-box"><div class="label">총 게임</div><div class="value num">${s.games}</div></div>
      <div class="stat-box"><div class="label">우승</div><div class="value num" style="color:var(--accent)">${s.wins}</div></div>
      <div class="stat-box"><div class="label">승률</div><div class="value num">${s.rate.toFixed(1)}%</div></div>
      <div class="stat-box"><div class="label">평균 순위</div><div class="value num">${s.avg!=null?s.avg.toFixed(2):'-'}</div></div>
      <div class="stat-box"><div class="label">내전 기록</div><div class="value num" style="font-size:15px">${s.recordGames}게임 ${s.recordWins}승</div></div>
    </div>
    ${admin ? `<div class="admin-box"><div class="title"><i class="fa-solid fa-shield-halved"></i> 기록 수동 추가 (관리자)</div>
      <p class="small muted" style="margin-bottom:10px">우승 기록에 없는 경기를 직접 더합니다. 현재 수동 추가: <b>${p.bonusGames||0}게임 ${p.bonusWins||0}승</b></p>
      <div class="toolbar">
        <button class="btn btn-sm btn-primary" data-adj="win+1"><i class="fa-solid fa-plus"></i> 1승 추가</button>
        <button class="btn btn-sm" data-adj="win-1"><i class="fa-solid fa-minus"></i> 1승 빼기</button>
        <button class="btn btn-sm" data-adj="game+1"><i class="fa-solid fa-plus"></i> 1게임(우승 외) 추가</button>
        <button class="btn btn-sm" data-adj="game-1"><i class="fa-solid fa-minus"></i> 1게임 빼기</button>
      </div></div>` : ''}
    <h3 class="section"><i class="fa-solid fa-clock-rotate-left"></i> 최근 경기 기록</h3>
    ${s.hist.length ? s.hist.slice(0,10).map(h => `<div class="match-row"><span class="match-rank rank-${h.rank}">${medal(h.rank)}</span>
        <div style="flex:1;min-width:0"><b>${esc(h.title)}</b><div class="small muted">${esc(h.date)} · ${esc(h.team)}</div></div>
        ${h.score!==''&&h.score!=null?`<span class="num muted">${esc(h.score)}점</span>`:''}</div>`).join('')
      : `<p class="muted small">대회 기록이 없습니다</p>`}`;
  if(admin){
    $('#pfEdit').onclick = () => openPlayerEditor(p);
    $$('[data-adj]', box).forEach(b => b.onclick = () => {
      const w = p.bonusWins || 0, g = p.bonusGames || 0;
      switch(b.dataset.adj){
        case 'win+1':  p.bonusWins = w + 1; p.bonusGames = g + 1; break;   // 우승도 1게임이므로 게임 수도 +1
        case 'win-1':  if(w <= 0) return toast('뺄 수동 승수가 없습니다','error'); p.bonusWins = w - 1; p.bonusGames = Math.max(0, g - 1); break;
        case 'game+1': p.bonusGames = g + 1; break;
        case 'game-1': if(g <= w) return toast('뺄 수 있는 (우승 외) 게임이 없습니다','error'); p.bonusGames = g - 1; break;
      }
      save(); drawProfileTable(); drawProfileDetail();
    });
  }
}

/* =====================================================================
   [페이지 7] 리더보드 (공개) - 카드를 누르면 전적 링크로 이동
   ===================================================================== */
let lbSort = 'tier', lbQuery = '';
function renderLeaderboard(el){
  el.innerHTML = `
    <header class="page-header">
      <div><h2 class="page-title">리더보드</h2><p class="page-sub">등록된 멤버 목록 및 전적 검색</p></div>
      <div class="header-right">
        <div class="sort-group"><button class="sort-btn ${lbSort==='tier'?'active':''}" data-sort="tier">티어순</button><button class="sort-btn ${lbSort==='name'?'active':''}" data-sort="name">이름순</button></div>
        <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input class="input" id="lbSearch" placeholder="멤버 또는 닉네임 검색..." value="${esc(lbQuery)}"></div>
      </div>
    </header>
    <div class="lb-grid" id="lbGrid"></div>`;
  drawLbGrid();
  $$('[data-sort]', el).forEach(b => b.onclick = () => { lbSort = b.dataset.sort; rerender(); });
  $('#lbSearch').addEventListener('input', e => { lbQuery = e.target.value; drawLbGrid(); });
}
function drawLbGrid(){
  const q = norm(lbQuery), admin = isAdmin();
  const list = db.players.filter(p => !q || norm(p.name).includes(q) || norm(p.ingame).includes(q));
  const card = p => `<div class="lb-card" data-pid="${esc(p.id)}">${tierBadge(p.tier)}
      ${admin ? `<button class="icon-btn edit" data-edit="${esc(p.id)}" title="수정"><i class="fa-solid fa-pen"></i></button>` : ''}
      ${avatar(p,78)}<div><div class="lb-name">${esc(p.name)}</div><div class="lb-ingame"><i class="fa-solid fa-gamepad"></i> ${esc(p.ingame || '-')}</div></div>
      <div class="lb-action">전적 검색 <i class="fa-solid fa-arrow-up-right-from-square"></i></div></div>`;
  let html = '';
  if(!list.length) html = `<div style="grid-column:1/-1" class="card">${emptyBox('fa-users', db.players.length ? '검색 결과가 없습니다' : '등록된 멤버가 없습니다')}</div>`;
  else if(lbSort === 'name') html = [...list].sort((a,b) => a.name.localeCompare(b.name,'ko')).map(card).join('');
  else{
    [...TIERS.map(t => t.k), null].forEach(k => {
      const g = list.filter(p => (tierInfo(p.tier)?.k ?? null) === k).sort((a,b) => a.name.localeCompare(b.name,'ko'));
      if(!g.length) return;
      const t = tierInfo(k);
      html += `<div class="tier-divider">${t?.icon?`<i class="fa-solid ${t.icon}"></i>`:''} ${k ? esc(k)+' Tier' : 'Unranked'}</div>` + g.map(card).join('');
    });
  }
  const grid = $('#lbGrid'); grid.innerHTML = html;
  $$('.lb-card', grid).forEach(c => c.onclick = e => {
    if(e.target.closest('[data-edit]')) return;
    window.open(recordUrl(findPlayer(c.dataset.pid)), '_blank', 'noopener,noreferrer');
  });
  $$('[data-edit]', grid).forEach(b => b.onclick = () => openPlayerEditor(findPlayer(b.dataset.edit)));
}

/* =====================================================================
   [페이지 8] 선수 티어표 (공개 열람 / 관리자는 등록·드래그로 티어 변경·삭제)
   ===================================================================== */
function renderTiers(el){
  const admin = isAdmin();
  const row = (label, sub, style, k, list) => `<div class="tier-row">
      <div class="tier-label" style="${style}">${label}${sub?`<small>${sub}</small>`:''}</div>
      <div class="tier-drop dropzone" data-drop="${esc(k)}">${list.map(p => chip(p,{ draggable:admin, showCost:false })).join('') || '<span class="muted small">-</span>'}</div></div>`;
  const tierOptions = sel => `<option value="">미배정</option>` + TIERS.map(t => `<option value="${esc(t.k)}" ${sel===t.k?'selected':''}>${esc(t.k)} (${t.cost}코)</option>`).join('');

  el.innerHTML = `
    <header class="page-header">
      <div><h2 class="page-title">${admin ? '선수 티어 관리' : '선수 티어표'}</h2>
        <p class="page-sub">${admin ? '선수를 드래그해 티어를 바꾸고, 클릭해 정보·전적 링크를 수정하세요. 변경 사항은 바로 저장됩니다.' : '현재 선수 티어와 코스트'}</p></div>
    </header>
    ${admin ? `<div class="card" style="margin-bottom:20px"><h3 class="section"><i class="fa-solid fa-user-plus"></i> 새 선수 등록</h3>
      <div class="form-grid">
        <label class="field">닉네임 *<input class="input" id="npName" placeholder="표시 이름"></label>
        <label class="field">인게임 닉네임<input class="input" id="npIngame" placeholder="게임 내 닉네임"></label>
        <label class="field">티어<select class="input" id="npTier">${tierOptions('')}</select></label>
        <label class="field">전적 링크<input class="input" id="npLink" placeholder="https://dak.gg/er/players/..."></label>
        <div class="field" style="grid-column:span 2">프로필 사진${photoPickerHtml('npPhoto','')}</div>
        <button class="btn btn-primary" id="npAdd" style="justify-content:center"><i class="fa-solid fa-plus"></i> 추가</button>
      </div>
      <p class="small muted" style="margin-top:10px">전적 링크를 비워두면 인게임 닉네임으로 dak.gg 전적 검색 주소가 자동으로 연결됩니다.</p></div>` : ''}
    <div class="tier-board">
      ${TIERS.map(t => row(`${t.icon?`<i class="fa-solid ${t.icon}" style="font-size:14px"></i>`:''}${esc(t.k)}`, `${t.cost}코`, `background:${t.color};color:${t.fg}`, t.k,
          db.players.filter(p => p.tier === t.k).sort((a,b) => a.name.localeCompare(b.name,'ko')))).join('')}
      ${row('<span style="font-size:14px">미배정</span>', '대기 명단', 'background:var(--bg-hover);color:var(--text-muted)', '', db.players.filter(p => !tierInfo(p.tier)).sort((a,b) => a.name.localeCompare(b.name,'ko')))}
      ${admin ? `<div class="delete-zone dropzone" data-drop="__delete"><i class="fa-solid fa-trash"></i> 선수 삭제 (여기로 드래그)</div>` : ''}
    </div>
    ${admin && !db.players.length ? `<div style="text-align:center;margin-top:20px"><button class="btn" id="npSample"><i class="fa-solid fa-wand-magic-sparkles"></i> 연습용 예시 선수 10명 넣기</button></div>` : ''}`;

  $$('.chip', el).forEach(c => c.onclick = () => {
    const p = findPlayer(c.dataset.pid);
    if(admin) openPlayerEditor(p); else { profileSel = p.id; location.hash = '#profile'; }
  });
  if(!admin) return;
  bindDnD(el, (pid, zone) => {
    const p = findPlayer(pid); if(!p) return;
    if(zone === '__delete') return confirmDialog(`"${p.name}" 선수를 삭제할까요? (우승 기록에 적힌 이름은 남습니다)`, () => deletePlayer(p), { okLabel:'삭제', danger:true });
    p.tier = zone || null; save(); rerender(); toast(`${p.name} → ${zone || '미배정'}`);
  });
  const npPhoto = bindPhotoPicker(el, 'npPhoto', '', () => $('#npName').value.trim());
  $('#npName').addEventListener('input', () => { if(!npPhoto.value) $('#npPhoto .pp-preview').innerHTML = avatar({ name:$('#npName').value.trim() || '?' }, 56); });
  $('#npAdd').onclick = () => {
    const name = $('#npName').value.trim(), link = $('#npLink').value.trim(), image = npPhoto.value;
    if(npPhoto.busy) return toast('사진을 처리하는 중입니다. 잠시 후 다시 눌러주세요','error');
    if(!name) return toast('닉네임을 입력하세요','error');
    if(db.players.some(p => norm(p.name) === norm(name))) return toast('같은 닉네임이 이미 있습니다','error');
    if(link && !safeUrl(link)) return toast('전적 링크는 http:// 또는 https:// 로 시작해야 합니다','error');
    const id = uid();
    db.players.push({ id, name, ingame:$('#npIngame').value.trim(), tier:$('#npTier').value || null, link,
                      present:false, team:null, bonusWins:0, bonusGames:0, createdAt:Date.now() });
    save(); rerender(); toast(`${name} 선수를 등록했습니다`);
    if(image) savePhoto(id, image).then(() => { save(); rerender(); }).catch(handleErr);
  };
  $('#npName').addEventListener('keydown', e => { if(e.key === 'Enter') $('#npAdd').click(); });
  const sample = $('#npSample');
  if(sample) sample.onclick = () => {
    ['가람','나래','다온','라온','마루','바다','새봄','아라','자몽','하늘'].forEach((n,i) =>
      db.players.push({ id:uid(), name:n, ingame:'', tier:TIERS[i % TIERS.length].k, link:'', present:true, team:null, bonusWins:0, bonusGames:0, createdAt:Date.now() }));
    save(); rerender(); toast('예시 선수를 넣었습니다. 연습 후 삭제하세요.');
  };
}
function deletePlayer(p){
  db.players = db.players.filter(x => x !== p);
  db.score.teams.forEach(t => t.members = t.members.filter(m => m.pid !== p.id));
  save(); closeModal(); rerender(); toast(`${p.name} 선수를 삭제했습니다`);
  if(photos[p.id]) savePhoto(p.id, null).catch(() => {});
}

/* ---------- 선수 정보 수정 모달 (티어표 · 리더보드 · 개인 기록에서 공통 사용) ---------- */
function openPlayerEditor(p){
  const m = openModal({
    title:`<i class="fa-solid fa-user-pen"></i> 선수 정보 수정`,
    body:`<label class="field">닉네임<input class="input" id="peName" value="${esc(p.name)}"></label>
      <label class="field">인게임 닉네임<input class="input" id="peIngame" value="${esc(p.ingame||'')}"></label>
      <label class="field">티어<select class="input" id="peTier"><option value="">미배정</option>${TIERS.map(t => `<option value="${esc(t.k)}" ${p.tier===t.k?'selected':''}>${esc(t.k)} (${t.cost}코)</option>`).join('')}</select></label>
      <label class="field">전적 링크<input class="input" id="peLink" value="${esc(p.link||'')}" placeholder="비우면 dak.gg 자동 검색"></label>
      <div class="field">프로필 사진${photoPickerHtml('pePhoto', p.name)}</div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr">
        <label class="field">수동 추가 승수<input class="input num" type="number" min="0" id="peBW" value="${p.bonusWins||0}"></label>
        <label class="field">수동 추가 게임 수<input class="input num" type="number" min="0" id="peBG" value="${p.bonusGames||0}"></label></div>
      <p class="small muted">수동 추가 값은 우승 기록과 별개로 개인 기록에 더해집니다. 게임 수는 승수보다 작을 수 없습니다.</p>`,
    footer:`<button class="btn btn-danger" id="peDel"><i class="fa-solid fa-trash"></i> 삭제</button><span class="spacer"></span>
      <button class="btn" data-x>취소</button><button class="btn btn-primary" id="peSave"><i class="fa-solid fa-floppy-disk"></i> 저장</button>`
  });
  $('[data-x]', m).onclick = closeModal;
  $('#peDel', m).onclick = () => confirmDialog(`"${p.name}" 선수를 삭제할까요? (우승 기록에 적힌 이름은 남습니다)`, () => deletePlayer(p), { okLabel:'삭제', danger:true });
  const oldPhoto = photos[p.id] || '';
  const pePhoto = bindPhotoPicker(m, 'pePhoto', oldPhoto, () => $('#peName', m).value.trim());
  $('#peSave', m).onclick = () => {
    const name = $('#peName', m).value.trim(), link = $('#peLink', m).value.trim(), image = pePhoto.value;
    if(pePhoto.busy) return toast('사진을 처리하는 중입니다. 잠시 후 다시 눌러주세요','error');
    const bw = Math.max(0, Math.floor(Number($('#peBW', m).value) || 0)), bg = Math.max(0, Math.floor(Number($('#peBG', m).value) || 0));
    if(!name) return toast('닉네임을 입력하세요','error');
    if(db.players.some(x => x !== p && norm(x.name) === norm(name))) return toast('같은 닉네임이 이미 있습니다','error');
    if(link && !safeUrl(link)) return toast('전적 링크는 http:// 또는 https:// 로 시작해야 합니다','error');
    if(bg < bw) return toast('게임 수는 승수보다 크거나 같아야 합니다','error');
    Object.assign(p, { name, ingame:$('#peIngame', m).value.trim(), tier:$('#peTier', m).value || null, link, bonusWins:bw, bonusGames:bg });
    db.score.teams.forEach(t => t.members.forEach(x => { if(x.pid === p.id) x.name = name; }));
    save(); closeModal(); rerender(); toast('저장했습니다');
    if(image !== oldPhoto) savePhoto(p.id, image).then(() => { save(); rerender(); }).catch(handleErr);
  };
}

/* =====================================================================
   [페이지 9] 관리자 설정 (마스터 전용)
   - 계정 추가(관리자/일반) · 권한 변경 · 일반 계정과 멤버 연결 · 비밀번호 초기화 · 삭제
   - 관리자·일반 계정은 사이드바 [내 계정]에서 본인 아이디·비밀번호만 바꿉니다.
   - 모든 계정 작업은 서버 함수가 마스터인지 확인한 뒤에만 처리합니다.
   ===================================================================== */
const MIN_PW = 8;
const ID_HINT = '영문·숫자·_ 2~20자';
const myAccountFields = acc => `
  <label class="field">아이디 (${ID_HINT})<input class="input" id="maId" value="${esc(acc.login_id)}" autocomplete="username" autocapitalize="off" spellcheck="false"></label>
  <label class="field">현재 비밀번호 <span class="small">(변경하려면 꼭 입력)</span><input class="input" type="password" id="maCur" autocomplete="current-password"></label>
  <label class="field">새 비밀번호 (${MIN_PW}자 이상, 바꾸지 않으려면 비워두기)<input class="input" type="password" id="maNew" autocomplete="new-password"></label>
  <label class="field">새 비밀번호 확인<input class="input" type="password" id="maNew2" autocomplete="new-password"></label>`;
// 성공하면 true
async function saveMyAccount(root){
  const me = currentAccount();
  const id = $('#maId', root).value.trim(), cur = $('#maCur', root).value;
  const nw = $('#maNew', root).value, nw2 = $('#maNew2', root).value;
  const idChanged = id !== me.login_id, pwChanged = nw !== '' || nw2 !== '';
  if(!idChanged && !pwChanged){ toast('바뀐 내용이 없습니다','error'); return false; }
  if(!cur){ toast('현재 비밀번호를 입력하세요','error'); return false; }
  if(idChanged && !ID_RULE.test(id)){ toast(`아이디는 ${ID_HINT}여야 합니다`,'error'); return false; }
  if(pwChanged){
    if(nw.length < MIN_PW){ toast(`새 비밀번호는 ${MIN_PW}자 이상이어야 합니다`,'error'); return false; }
    if(nw !== nw2){ toast('새 비밀번호 확인이 일치하지 않습니다','error'); return false; }
    if(nw === cur){ toast('현재 비밀번호와 다른 비밀번호를 쓰세요','error'); return false; }
  }
  try{
    const acc = await API.rpc('update_my_account', { p_token:session.token, p_current:cur,
      p_new_login: idChanged ? id : null, p_new_password: pwChanged ? nw : null });
    setSession({ ...session, account:acc });
  }catch(e){ handleErr(e); return false; }
  toast(idChanged && pwChanged ? '아이디와 비밀번호를 변경했습니다' : idChanged ? '아이디를 변경했습니다' : '비밀번호를 변경했습니다');
  return true;
}
function openMyAccountModal(){
  const me = currentAccount();
  const m = openModal({ title:'<i class="fa-solid fa-id-card"></i> 내 계정',
    body:`<div style="display:flex;gap:10px;align-items:center">${roleBadge(me.role)}${linkedPlayer(me) ? `<span class="small muted">연결 멤버: <b>${esc(linkedPlayer(me).name)}</b></span>` : ''}</div>${myAccountFields(me)}`,
    footer:`<button class="btn" data-x>취소</button><button class="btn btn-primary" id="maSave"><i class="fa-solid fa-floppy-disk"></i> 저장</button>` });
  $('[data-x]', m).onclick = closeModal;
  $('#maSave', m).onclick = async () => { const b = $('#maSave', m); b.disabled = true; if(await saveMyAccount(m)){ closeModal(); renderSidebar(); } else b.disabled = false; };
}
let settingsAccounts = null;   // 마지막으로 불러온 계정 목록
async function renderSettings(el){
  const me = currentAccount();
  const fmtDate = t => { if(!t) return '-'; const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
  const roleSelect = (attr, sel) => `<select class="input" ${attr} style="width:auto;padding:5px 8px">
      <option value="admin" ${sel==='admin'?'selected':''}>관리자</option><option value="member" ${sel==='member'?'selected':''}>일반</option></select>`;
  const draw = list => {
    const taken = acc => new Set(list.filter(a => a !== acc && a.player_id).map(a => a.player_id));
    const playerSelect = (attr, acc) => { const t = taken(acc);
      return `<select class="input" ${attr} style="width:auto;min-width:120px;padding:5px 8px"><option value="">연결 안 함</option>
        ${[...db.players].sort((a,b) => a.name.localeCompare(b.name,'ko')).map(p =>
          `<option value="${esc(p.id)}" ${acc && acc.player_id===p.id?'selected':''} ${t.has(p.id)?'disabled':''}>${esc(p.name)}${t.has(p.id)?' (연결됨)':''}</option>`).join('')}</select>`; };
    const legacy = (() => { try{ const d = JSON.parse(localStorage.getItem('irido_db_v1')); return d && Array.isArray(d.players) && d.players.length ? d : null; }catch{ return null; } })();
    el.innerHTML = `
    <header class="page-header"><div><h2 class="page-title">관리자 설정</h2><p class="page-sub">마스터 전용 · 계정과 멤버 연결을 관리합니다</p></div></header>
    <div class="settings-layout">
      <div class="card">
        <h3 class="section"><i class="fa-solid fa-id-card"></i> 내 계정</h3>
        <div style="display:flex;flex-direction:column;gap:12px" id="maBox">
          <div>${roleBadge(me.role)}</div>${myAccountFields(me)}
          <button class="btn btn-primary" id="maSave" style="align-self:flex-start"><i class="fa-solid fa-floppy-disk"></i> 저장</button>
        </div>
        <div class="notice" style="margin-top:18px;line-height:1.9">
          <b>권한 안내</b><br>
          ${roleBadge('master')} 모든 기능 + 계정 관리(이 화면)<br>
          ${roleBadge('admin')} 출/퇴근 · 드래프트 · 점수판 · 선수/기록 편집 · 본인 계정 관리<br>
          ${roleBadge('member')} 연결된 본인 멤버의 출/퇴근 · 본인 계정 관리
        </div>
        ${legacy ? `<div class="notice" style="margin-top:12px;line-height:1.7"><b>이 브라우저에 예전 데이터가 있습니다</b><br>
          서버로 옮기기 전, 이 브라우저에만 저장되던 선수 ${legacy.players.length}명 · 기록 ${(legacy.records||[]).length}개입니다.<br>
          <button class="btn btn-sm" id="legacyUp" style="margin-top:8px"><i class="fa-solid fa-cloud-arrow-up"></i> 서버로 올리기</button></div>` : ''}
      </div>
      <div class="card">
        <h3 class="section"><i class="fa-solid fa-users-gear"></i> 계정 관리</h3>
        <div class="tbl-wrap" style="margin-bottom:18px"><table class="tbl">
          <thead><tr><th>아이디</th><th>권한</th><th>연결 멤버</th><th>등록일</th><th></th></tr></thead>
          <tbody>${list.map(a => `<tr><td><b>${esc(a.login_id)}</b></td>
            <td>${a.role === 'master' ? roleBadge('master') : roleSelect(`data-role="${esc(a.id)}"`, a.role)}</td>
            <td>${a.role === 'member' ? playerSelect(`data-link="${esc(a.id)}"`, a) : '<span class="muted small">-</span>'}</td>
            <td class="muted small" style="white-space:nowrap">${fmtDate(a.created_at)}</td>
            <td style="text-align:right;white-space:nowrap">${a.role === 'master' ? '<span class="small muted">삭제 불가</span>' : `
              <button class="btn btn-sm" data-reset="${esc(a.id)}"><i class="fa-solid fa-rotate"></i> 비밀번호 초기화</button>
              <button class="btn btn-sm btn-danger" data-remove="${esc(a.id)}"><i class="fa-solid fa-trash"></i> 삭제</button>`}</td></tr>`).join('')}
          </tbody></table></div>
        <h3 class="section" style="font-size:15px"><i class="fa-solid fa-user-plus"></i> 계정 추가</h3>
        <div class="form-grid">
          <label class="field">아이디 (${ID_HINT})<input class="input" id="acId" autocapitalize="off" spellcheck="false"></label>
          <label class="field">초기 비밀번호 (${MIN_PW}자 이상)<input class="input" type="password" id="acPw" autocomplete="new-password"></label>
          <label class="field">권한${roleSelect('id="acRole"', 'member')}</label>
          <label class="field" id="acLinkWrap">연결 멤버 (일반 계정)${playerSelect('id="acLink"', null)}</label>
          <button class="btn btn-primary" id="acAdd" style="justify-content:center"><i class="fa-solid fa-plus"></i> 계정 추가</button>
        </div>
        <p class="small muted" style="margin-top:10px">일반 계정은 연결된 멤버의 출/퇴근만 바꿀 수 있습니다. 멤버는 나중에 표에서 연결해도 됩니다.</p>
      </div>
    </div>`;
    bind(list, legacy);
  };
  const reload = async () => {
    try{ settingsAccounts = await API.rpc('list_accounts', { p_token:session.token }); }
    catch(e){ handleErr(e); return; }
    if(current === 'settings') draw(settingsAccounts);
  };
  const act = async (fn, args, okMsg) => {
    try{ await API.rpc(fn, { p_token:session.token, ...args }); if(okMsg) toast(okMsg); }
    catch(e){ handleErr(e); }
    await reload();
  };
  const bind = (list, legacy) => {
    $('#maSave').onclick = async () => { const b = $('#maSave'); b.disabled = true; if(await saveMyAccount($('#maBox'))){ renderSidebar(); draw(list); } else b.disabled = false; };
    const syncLinkField = () => { $('#acLinkWrap').style.display = $('#acRole').value === 'member' ? '' : 'none'; };
    $('#acRole').onchange = syncLinkField; syncLinkField();
    $('#acAdd').onclick = () => {
      const id = $('#acId').value.trim(), pw = $('#acPw').value, role = $('#acRole').value === 'admin' ? 'admin' : 'member';
      if(!ID_RULE.test(id)) return toast(`아이디는 ${ID_HINT}여야 합니다`,'error');
      if(pw.length < MIN_PW) return toast(`초기 비밀번호는 ${MIN_PW}자 이상이어야 합니다`,'error');
      act('add_account', { p_login:id, p_password:pw, p_role:role, p_player_id: role === 'member' ? ($('#acLink').value || null) : null },
          `${id} ${ROLES[role].label} 계정을 추가했습니다`);
    };
    $$('[data-role]', el).forEach(sel => sel.onchange = () => {
      const acc = list.find(a => a.id === sel.dataset.role); if(!acc) return;
      act('update_account', { p_account_id:acc.id, p_role:sel.value, p_player_id: sel.value === 'member' ? acc.player_id : null },
          `${acc.login_id} → ${ROLES[sel.value].label}`);
    });
    $$('[data-link]', el).forEach(sel => sel.onchange = () => {
      const acc = list.find(a => a.id === sel.dataset.link); if(!acc) return;
      const pid = sel.value || null;
      act('update_account', { p_account_id:acc.id, p_role:acc.role, p_player_id:pid },
          pid ? `${acc.login_id} ↔ ${findPlayer(pid)?.name || ''} 연결` : `${acc.login_id} 연결 해제`);
    });
    $$('[data-remove]', el).forEach(b => b.onclick = () => {
      const acc = list.find(a => a.id === b.dataset.remove); if(!acc) return;
      confirmDialog(`${acc.login_id} 계정을 삭제할까요?`, () => act('delete_account', { p_account_id:acc.id }, '계정을 삭제했습니다'), { okLabel:'삭제', danger:true });
    });
    $$('[data-reset]', el).forEach(b => b.onclick = () => {
      const acc = list.find(a => a.id === b.dataset.reset); if(!acc) return;
      const m = openModal({ title:'<i class="fa-solid fa-rotate"></i> 비밀번호 초기화',
        body:`<p class="small muted">${esc(acc.login_id)} 계정의 새 비밀번호를 정합니다. 그 계정은 로그아웃됩니다.</p>
          <label class="field">새 비밀번호 (${MIN_PW}자 이상)<input class="input" type="password" id="rsPw" autocomplete="new-password"></label>`,
        footer:`<button class="btn" data-x>취소</button><button class="btn btn-primary" id="rsGo">변경</button>` });
      $('[data-x]', m).onclick = closeModal;
      $('#rsGo', m).onclick = () => {
        const pw = $('#rsPw', m).value;
        if(pw.length < MIN_PW) return toast(`비밀번호는 ${MIN_PW}자 이상이어야 합니다`,'error');
        closeModal(); act('reset_password', { p_account_id:acc.id, p_password:pw }, '비밀번호를 초기화했습니다');
      };
      $('#rsPw', m).focus();
    });
    if(legacy) $('#legacyUp').onclick = () => confirmDialog(
      `이 브라우저의 예전 데이터(선수 ${legacy.players.length}명)를 서버에 올립니다. 지금 서버에 있는 데이터는 덮어씌워집니다.`,
      async () => { await uploadData(legacy); localStorage.removeItem('irido_db_v1'); }, { okLabel:'올리기', danger:true });
  };
  if(settingsAccounts) draw(settingsAccounts);
  else el.innerHTML = `<div class="card">${emptyBox('fa-spinner fa-spin','계정 목록을 불러오는 중...')}</div>`;
  reload();
}

/* =====================================================================
   웹 앱 설치 (PWA)
   - 안드로이드 크롬·삼성 인터넷·PC 크롬/엣지: 설치 창을 바로 띄웁니다.
   - 아이폰·아이패드(사파리): 설치 창이 없어서 "공유 → 홈 화면에 추가" 방법을 안내합니다.
   - 이미 앱으로 열려 있으면 버튼을 숨깁니다.
   ===================================================================== */
let installPrompt = null;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isMobile = () => isIOS() || /android/i.test(navigator.userAgent);
const installAvailable = () => !isStandalone() && (!!installPrompt || isMobile());
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if(booted) renderSidebar(); });
window.addEventListener('appinstalled', () => { installPrompt = null; toast('ETER:RE 앱을 설치했습니다'); if(booted) renderSidebar(); });
async function installApp(){
  if(installPrompt){
    installPrompt.prompt();
    const { outcome } = await installPrompt.userChoice;
    installPrompt = null; renderSidebar();
    if(outcome !== 'accepted') toast('설치를 취소했습니다');
    return;
  }
  const ios = isIOS();
  openModal({ title:'<i class="fa-solid fa-mobile-screen-button"></i> 앱으로 설치하기',
    body: ios ? `
      <p style="line-height:1.7">아이폰·아이패드는 <b>사파리</b>에서 설치할 수 있습니다.</p>
      <ol style="line-height:2;padding-left:20px">
        <li>화면 아래(아이패드는 위)의 <b>공유 버튼</b> <i class="fa-solid fa-arrow-up-from-bracket"></i> 을 누릅니다.</li>
        <li>목록을 내려 <b>홈 화면에 추가</b> <i class="fa-regular fa-square-plus"></i> 를 누릅니다.</li>
        <li>오른쪽 위 <b>추가</b>를 누르면 홈 화면에 ETER:RE 아이콘이 생깁니다.</li>
      </ol>
      <p class="small muted">카카오톡 등 다른 앱 안에서 연 경우, 먼저 "사파리로 열기"를 눌러 주세요.</p>` : `
      <p style="line-height:1.7">브라우저 메뉴에서 설치할 수 있습니다.</p>
      <ol style="line-height:2;padding-left:20px">
        <li>오른쪽 위(삼성 인터넷은 아래)의 <b>메뉴</b> <i class="fa-solid fa-ellipsis-vertical"></i> 를 누릅니다.</li>
        <li><b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 누릅니다.</li>
        <li><b>설치</b>를 누르면 홈 화면에 ETER:RE 아이콘이 생깁니다.</li>
      </ol>
      <p class="small muted">카카오톡 등 다른 앱 안에서 연 경우, 먼저 "다른 브라우저로 열기"를 눌러 주세요.</p>` });
}
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW 등록 실패', e)));
}

/* ---------- 시작: 서버에서 데이터·로그인 상태를 불러온 뒤 화면 표시 ---------- */
async function boot(){
  document.title = `${CONFIG.SITE_NAME} - 내전 매니저`;
  $('#brandName').textContent = CONFIG.SITE_NAME;
  applyTheme(); renderSidebar();
  $('#page').innerHTML = `<div class="card">${emptyBox('fa-spinner fa-spin','데이터를 불러오는 중...')}</div>`;
  try{ await Promise.all([loadState(), loadPhotos()]); }
  catch(e){
    console.error(e); setSync('offline');
    $('#page').innerHTML = `<div class="card">${emptyBox('fa-plug-circle-xmark','서버에 연결할 수 없습니다.<br>잠시 후 새로고침해 주세요.')}</div>`;
    return;
  }
  if(session){   // 저장된 로그인이 아직 유효한지 서버에 확인
    try{ setSession({ ...session, account: await API.rpc('me', { p_token:session.token }) }); }
    catch(e){ if(e.code === 'AUTH_REQUIRED') setSession(null); }
  }
  booted = true; setSync('saved'); route();
}
boot();
</script>
