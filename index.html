<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 웹 앱(PWA) 설정: 홈 화면에 설치하면 앱처럼 열립니다 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ETER:RE">
<title>이터리 - 내전 매니저</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* =========================================================
   1. 테마 색상 (다크 / 화이트 / 베이지)
   - CSS 변수(--이름)를 바꾸면 사이트 전체 색이 바뀝니다.
   ========================================================= */
:root{
  --bg-main:#050505; --bg-panel:#111; --bg-hover:#1a1a1a; --bg-input:#000; --bg-details:#080808;
  --text-main:#e0e0e0; --text-muted:#7e7e7e; --border-color:#2a2a2a;
  --accent:#eebc51; --accent-dim:rgba(238,188,81,.1);
  --danger:#ff4757; --success:#2ed573; --sidebar-w:250px;
}
body.light-mode{
  --bg-main:#f0f2f5; --bg-panel:#fff; --bg-hover:#f5f6f8; --bg-input:#fff; --bg-details:#f1f2f6;
  --text-main:#1c1e21; --text-muted:#65676b; --border-color:#e4e6eb;
  --accent:#d35400; --accent-dim:rgba(211,84,0,.1);
}
body.beige-mode{
  --bg-main:#f5f1e6; --bg-panel:#fffdf5; --bg-hover:#efe9db; --bg-input:#fffdf5; --bg-details:#efeadd;
  --text-main:#4a4036; --text-muted:#8c8379; --border-color:#dcd3c5;
  --accent:#b08d55; --accent-dim:rgba(176,141,85,.12);
}

/* 2. 기본 초기화 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg-main);color:var(--text-main);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;transition:background-color .3s,color .3s;font-size:15px}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit}
ul{list-style:none}

/* 3. 전체 레이아웃: 왼쪽 사이드바 + 오른쪽 본문 */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--bg-panel);border-right:1px solid var(--border-color);display:flex;flex-direction:column;padding:28px 16px;position:sticky;top:0;height:100vh;flex-shrink:0;overflow-y:auto;z-index:50}
.brand{font-size:24px;font-weight:800;color:var(--accent);text-align:center;padding-bottom:20px;margin-bottom:24px;border-bottom:1px solid var(--border-color);letter-spacing:-.5px}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:2px;margin-top:4px}
.menu{display:flex;flex-direction:column;gap:6px;flex-grow:1}
.menu-item{display:flex;align-items:center;gap:12px;padding:12px 16px;color:var(--text-muted);border-radius:4px;font-weight:600;font-size:15px;border:0;border-left:3px solid transparent;cursor:pointer;transition:.2s;background:none;width:100%;text-align:left}
.menu-item i{width:20px;text-align:center}
.menu-item:hover{background:var(--bg-hover);color:var(--text-main)}
.menu-item.active{background:var(--accent-dim);color:var(--accent);border-left-color:var(--accent)}
.menu-item .lock{margin-left:auto;font-size:11px;opacity:.6;width:auto}
.sidebar-bottom{margin-top:20px;padding-top:16px;border-top:1px solid var(--border-color);display:flex;flex-direction:column;gap:2px}
.admin-pill{font-size:12px;color:var(--success);background:rgba(46,213,115,.1);border-radius:6px;padding:8px 12px;margin-bottom:6px;display:flex;gap:8px;align-items:center;word-break:break-all}
.install-btn{color:var(--accent)!important}
@media (display-mode: standalone){ .sidebar{padding-top:max(28px, env(safe-area-inset-top))} .content{padding-bottom:max(60px, env(safe-area-inset-bottom))} }
.sync-status{font-size:12px;color:var(--text-muted);padding:4px 12px 8px;display:flex;gap:6px;align-items:center}
.sync-status.saved i{color:var(--success)}
.sync-status.error,.sync-status.offline{color:var(--danger)}
.sidebar-footer{text-align:center;font-size:12px;color:var(--text-muted);margin-top:16px}
.content{flex:1;padding:36px 40px 60px;min-width:0}

/* 4. 공통 컴포넌트 */
.page-header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.page-title{font-size:28px;font-weight:800;letter-spacing:-.5px}
.page-sub{color:var(--text-muted);margin-top:6px;font-size:14px}
.header-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--bg-panel);border:1px solid var(--border-color);border-radius:12px;padding:22px;min-width:0}
.card-header{font-weight:700;color:var(--text-muted);font-size:14px;margin-bottom:16px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.card-header .left{display:flex;align-items:center;gap:8px}
.card-header i{color:var(--accent)}
h3.section{font-size:17px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
h3.section i{color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:7px;border:1px solid var(--border-color);background:var(--bg-hover);color:var(--text-main);font-weight:600;font-size:14px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#111}
.btn-primary:hover{filter:brightness(1.1);color:#111}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.icon-btn{background:none;border:0;color:var(--text-muted);cursor:pointer;padding:6px;border-radius:6px;font-size:14px}
.icon-btn:hover{color:var(--accent);background:var(--bg-hover)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input,select.input,textarea.input{background:var(--bg-input);border:1px solid var(--border-color);color:var(--text-main);padding:9px 12px;border-radius:6px;font-size:14px;outline:none;width:100%;transition:border-color .15s}
.input:focus{border-color:var(--accent)}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-muted);font-weight:600}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;align-items:end}
.muted{color:var(--text-muted)}
.small{font-size:12px}
.empty{color:var(--text-muted);text-align:center;padding:40px 10px;font-size:14px;line-height:1.7}
.empty i{font-size:28px;display:block;margin-bottom:10px;opacity:.5}
.search-box{position:relative}
.search-box input{padding-left:34px;min-width:230px}
.search-box i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px}

/* 표 */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;color:var(--text-muted);font-size:12px;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border-color);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--border-color);font-size:14px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover td{background:var(--bg-hover)}
.tbl tr.selected td{background:var(--accent-dim)}
.num{font-variant-numeric:tabular-nums}
.rank-1{color:#f1c40f;font-weight:800}
.rank-2{color:#bdc3c7;font-weight:800}
.rank-3{color:#cd7f32;font-weight:800}

/* 티어 배지, 아바타, 칩 */
.tier-badge{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:2px 8px;border-radius:4px;font-weight:800;font-size:12px;line-height:1.5;white-space:nowrap}
.tier-badge.unranked{background:var(--bg-hover);color:var(--text-muted);border:1px solid var(--border-color)}
.avatar{border-radius:50%;object-fit:cover;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--bg-hover);border:2px solid var(--border-color);color:var(--text-muted);font-weight:800}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:999px;background:var(--bg-hover);border:1px solid var(--border-color);font-size:13px;font-weight:600;cursor:pointer;user-select:none;transition:.15s}
.chip:hover{border-color:var(--accent)}
.chip.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
.chip.dragging{opacity:.4}
.chip .cost{font-size:11px;color:var(--text-muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.name-chip{display:inline-block;padding:2px 8px;margin:2px 4px 2px 0;border-radius:4px;background:var(--bg-hover);font-size:12px}
.dropzone.drag-over{outline:2px dashed var(--accent);outline-offset:-4px;background:var(--accent-dim)}

/* 5. 대시보드 (벤토 그리드) */
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.stat-body{display:flex;align-items:center;gap:14px}
.stat-name{font-size:20px;font-weight:800}
.stat-value{color:var(--accent);font-weight:700;margin-top:3px}
.dist-row{display:flex;align-items:center;gap:10px;padding:5px 0}
.dist-row .tier-badge{min-width:76px}
.dist-bar{flex:1;height:10px;border-radius:5px;background:var(--bg-hover);overflow:hidden}
.dist-bar span{display:block;height:100%;border-radius:5px;transition:width .3s}
.dist-row b{width:24px;text-align:right}
.winner-card{position:relative;overflow:hidden}
.winner-card::before{content:'';position:absolute;inset:-40% -40% auto auto;width:220px;height:220px;background:radial-gradient(circle,var(--accent-dim),transparent 70%);pointer-events:none}
.winner-team{font-size:22px;font-weight:800;color:var(--accent);margin-bottom:6px}
.podium-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border-color)}
.podium-row:last-child{border-bottom:0}
.podium-rank{width:26px;font-weight:800;text-align:center}

/* 6. 출/퇴근 */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.settings-layout{display:grid;grid-template-columns:minmax(300px,0.8fr) 1.4fr;gap:20px;align-items:start}
.att-list{display:flex;flex-direction:column;gap:6px;max-height:65vh;overflow-y:auto}
.att-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;border:1px solid var(--border-color);cursor:pointer;transition:.15s;background:var(--bg-details)}
.att-item:hover{border-color:var(--accent)}
.att-item .grow{flex:1;font-weight:600}
.att-item.locked{cursor:default;opacity:.75}
.att-item.locked:hover{border-color:var(--border-color)}
.att-item.mine{border-color:var(--accent)}
.my-att{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.summary b{color:var(--accent)}

/* 7. 드래프트 */
.draft-layout{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
.pool{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto}
.tier-group-label{font-size:12px;font-weight:800;color:var(--text-muted);margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.team-card{background:var(--bg-panel);border:1px solid var(--border-color);border-radius:12px;padding:14px;min-height:150px;display:flex;flex-direction:column;gap:10px;cursor:default}
.team-head{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.team-cost{font-size:12px;color:var(--accent);font-weight:700}
.team-members{display:flex;flex-direction:column;gap:6px}
.team-members .chip{width:100%;border-radius:8px}

/* 8. 점수판 */
.score-layout{display:grid;grid-template-columns:minmax(300px,0.8fr) 1.2fr;gap:20px;align-items:start}
.score-input{width:64px;text-align:center;padding:6px}
.cp-toggle{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--border-color);border-radius:7px;background:var(--bg-panel);font-size:14px;font-weight:600}
.cp-toggle input[type=number]{width:70px;padding:5px 8px}
tr.cp-reached td{background:rgba(255,71,87,.08)}
.team-name-input{min-width:110px;font-weight:700}

/* 9. 우승 기록 */
.fame-layout{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.record{border:1px solid var(--border-color);border-radius:10px;margin-bottom:10px;background:var(--bg-details);overflow:hidden}
.record-head{display:flex;gap:14px;align-items:center;padding:14px 16px;cursor:pointer}
.record-head:hover{background:var(--bg-hover)}
.record-head .crown{font-size:22px;color:#f1c40f}
.record-head .grow{flex:1;min-width:0}
.record-title{font-weight:800}
.record-meta{font-size:12px;color:var(--text-muted);margin-top:3px}
.record-score{font-weight:800;color:var(--accent);font-size:18px;white-space:nowrap}
.record-detail{border-top:1px solid var(--border-color);padding:6px 10px 10px;background:var(--bg-panel)}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px}
.editor-table td{padding:6px;border-bottom:1px solid var(--border-color)}
.editor-table .rank-label{font-weight:800;white-space:nowrap;width:46px;text-align:center}
.helper-chips{display:flex;flex-wrap:wrap;gap:6px;max-height:120px;overflow-y:auto;padding:10px;border:1px dashed var(--border-color);border-radius:8px;margin-top:8px}
.helper-chips button{border:1px solid var(--border-color);background:var(--bg-hover);color:var(--text-main);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.helper-chips button:hover{border-color:var(--accent);color:var(--accent)}

/* 10. 개인 기록 */
.profile-layout{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
.profile-detail{position:sticky;top:20px}
.profile-top{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.profile-name{font-size:24px;font-weight:800}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat-box{background:var(--bg-details);border:1px solid var(--border-color);border-radius:10px;padding:12px;text-align:center}
.stat-box .label{font-size:12px;color:var(--text-muted);font-weight:600}
.stat-box .value{font-size:20px;font-weight:800;margin-top:4px}
.admin-box{border:1px solid rgba(46,213,115,.35);background:rgba(46,213,115,.05);border-radius:10px;padding:14px;margin-bottom:18px}
.admin-box .title{font-size:13px;font-weight:800;color:var(--success);margin-bottom:10px;display:flex;gap:6px;align-items:center}
.match-row{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border-color);font-size:14px}
.match-row:last-child{border-bottom:0}
.match-rank{width:44px;text-align:center;font-weight:800;padding:3px 0;border-radius:6px;background:var(--bg-hover)}

/* 11. 리더보드 카드 */
.sort-group{display:flex;background:var(--bg-panel);border-radius:8px;padding:4px;border:1px solid var(--border-color)}
.sort-btn{background:transparent;border:0;color:var(--text-muted);padding:6px 12px;cursor:pointer;border-radius:6px;font-weight:600;font-size:14px}
.sort-btn.active{background:var(--accent);color:#111}
.lb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.tier-divider{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:18px;color:var(--accent);font-weight:800;font-size:18px}
.tier-divider::after{content:'';flex:1;height:1px;background:var(--border-color);margin-left:8px}
.lb-card{position:relative;background:var(--bg-panel);border:1px solid var(--border-color);border-radius:14px;padding:22px 16px 16px;text-align:center;cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:10px}
.lb-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.lb-card .tier-badge{position:absolute;top:12px;left:12px}
.lb-card .edit{position:absolute;top:8px;right:8px}
.lb-name{font-weight:800;font-size:17px}
.lb-ingame{font-size:13px;color:var(--text-muted)}
.lb-action{margin-top:4px;font-size:12px;font-weight:700;color:var(--accent);display:flex;gap:6px;align-items:center}

/* 12. 티어표 */
.tier-board{display:flex;flex-direction:column;gap:8px}
.tier-row{display:flex;border:1px solid var(--border-color);border-radius:10px;overflow:hidden;background:var(--bg-panel);min-height:58px}
.tier-label{width:110px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:20px;gap:2px}
.tier-label small{font-size:11px;font-weight:700;opacity:.8}
.tier-drop{flex:1;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:center}
.photo-picker{display:flex;gap:12px;align-items:center;padding:8px 10px;border:1px dashed var(--border-color);border-radius:8px;background:var(--bg-input)}
.photo-picker .pp-preview{display:inline-flex}
.delete-zone{border:2px dashed var(--danger);color:var(--danger);border-radius:10px;padding:18px;text-align:center;font-weight:700;margin-top:6px}
.delete-zone.drag-over{background:rgba(255,71,87,.12)}

/* 13. 모달 & 토스트 */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg-panel);border:1px solid var(--border-color);border-radius:14px;width:100%;max-width:460px;max-height:90vh;display:flex;flex-direction:column}
.modal.wide{max-width:860px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border-color)}
.modal-head h3{font-size:18px}
.modal-body{padding:20px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border-color);display:flex;justify-content:flex-end;gap:8px}
.modal-foot .spacer{flex:1}
.toast-wrap{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:2000}
.toast{background:var(--bg-panel);border:1px solid var(--border-color);border-left:4px solid var(--success);padding:12px 16px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px;font-weight:600;animation:fade .2s;max-width:340px}
.toast.error{border-left-color:var(--danger)}
.notice{font-size:12px;color:var(--text-muted);background:var(--bg-details);border:1px solid var(--border-color);border-radius:8px;padding:10px 12px;line-height:1.6}

/* 14. 반응형 (화면이 좁을 때) */
@media (max-width:1100px){
  .bento{grid-template-columns:1fr 1fr}
  .score-layout,.fame-layout,.profile-layout,.draft-layout,.settings-layout{grid-template-columns:1fr}
  .pool,.profile-detail{position:static;max-height:none}
}
@media (max-width:760px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:relative;padding:14px}
  .brand{margin-bottom:10px;padding-bottom:10px;font-size:20px}
  .menu{flex-direction:row;overflow-x:auto;gap:4px}
  .menu-item{white-space:nowrap;padding:9px 12px;border-left:0;border-bottom:3px solid transparent;font-size:14px}
  .menu-item.active{border-bottom-color:var(--accent)}
  .sidebar-bottom{flex-direction:row;flex-wrap:wrap;margin-top:8px;padding-top:8px}
  .sidebar-bottom .menu-item{width:auto}
  .sidebar-footer{display:none}
  .content{padding:20px 16px 40px}
  .bento,.two-col{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .tier-label{width:72px;font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="brand"><i class="fa-solid fa-infinity"></i> <span id="brandName">이터리</span><small>SCRIM MANAGER</small></div>
    <ul class="menu" id="menu"></ul>

/* =====================================================================

   - 계정·비밀번호는 서버에만 있습니다 (사이트 파일에는 없음).

const CONFIG = {

  SUPABASE_KEY: 'sb_publishable_58kSGjnLsEuwvzDaokNQ8g_GIZBRPsj',

/* ---------- 티어 정의 (이름, 코스트, 색) ---------- */
const TIERS = [

const OLD_TIER_MAP = { 'SSS':'S', 'SS':'S', '닭':'F', '나뭇가지':'F' };
const tierInfo  = k => TIERS.find(t => t.k === k) || null;
const costOf    = p => (tierInfo(p.tier)?.cost ?? 0);
const tierIndex = k => { const i = TIERS.findIndex(t => t.k === k); return i < 0 ? 99 : i; };

/* =====================================================================
   데이터 (Supabase의 app_state 표 한 줄에 통째로 저장)
   db.players : 선수 목록      db.records : 우승 기록(1~8등)

   선수 사진은 용량이 커서 photos 표에 따로 저장합니다.
   ===================================================================== */
function defaultDB(){
  return { players:[], records:[], draft:{ teamCount:8 },

// photoSink 를 주면 예전 데이터에 들어 있던 사진(p.image)을 꺼내 담습니다.
function normalizeDB(d, photoSink){
  const base = defaultDB();
  const out = { ...base, ...d, draft:{...base.draft, ...(d.draft||{})}, score:{...base.score, ...(d.score||{})} };
  out.players = Array.isArray(out.players) ? out.players : [];
  out.records = Array.isArray(out.records) ? out.records : [];
  delete out.photos;
  out.players.forEach(p => {
    if(p.tier && !TIERS.some(t => t.k === p.tier)) p.tier = OLD_TIER_MAP[p.tier] || null;
    if('image' in p){
      if(photoSink && typeof p.image === 'string' && p.image.startsWith('data:image/')) photoSink[p.id] = p.image;
      delete p.image;
    }
  });
  return out;
}
let db = defaultDB();
let photos = {};            // { 선수id: 사진 data URL }
let stateVersion = -1;      // 서버 데이터 버전 (동시에 고치는 것을 막는 데 사용)

// HTML 특수문자 이스케이프: 사용자가 입력한 글자가 코드로 실행되지 않게 막습니다.
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// http/https 주소만 허용 (javascript: 같은 위험한 링크 차단)
function safeUrl(u){
  if(!u) return null;
  try{ const x = new URL(String(u).trim()); return (x.protocol==='http:'||x.protocol==='https:') ? x.href : null; }
  catch{ return null; }
}
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const norm = s => String(s||'').trim().toLowerCase();
const pad = n => String(n).padStart(2,'0');

const byTierName = (a,b) => tierIndex(a.tier) - tierIndex(b.tier) || a.name.localeCompare(b.name,'ko');

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* =====================================================================
   서버(Supabase) 통신
   - 읽기: REST로 표를 바로 읽음 (누구나 가능)
   - 쓰기: 서버 함수(RPC)만 호출 가능. 함수 안에서 로그인·권한을 검사합니다.
   ===================================================================== */
const API = {
  async req(path, opts = {}){
    const r = await fetch(CONFIG.SUPABASE_URL + path, { ...opts,
      headers:{ apikey:CONFIG.SUPABASE_KEY, 'Content-Type':'application/json', ...(opts.headers || {}) } });
    const text = await r.text();
    let body = null; try{ body = text ? JSON.parse(text) : null; }catch{ body = text; }
    if(!r.ok){ const code = (body && body.message) || ('HTTP_' + r.status); const e = new Error(code); e.code = code; throw e; }
    return body;
  },
  rpc(fn, args){ return this.req('/rest/v1/rpc/' + fn, { method:'POST', body:JSON.stringify(args) }); },
  get(table, query){ return this.req(`/rest/v1/${table}?${query}`); },
};
const ERR_MSG = {
  INVALID_LOGIN:'아이디 또는 비밀번호가 올바르지 않습니다', AUTH_REQUIRED:'로그인이 만료되었습니다. 다시 로그인하세요',
  FORBIDDEN:'이 계정에는 권한이 없습니다', WRONG_PASSWORD:'현재 비밀번호가 올바르지 않습니다',
  BAD_LOGIN_ID:'아이디는 영문·숫자·_ 2~20자여야 합니다', LOGIN_TAKEN:'이미 사용 중인 아이디입니다',
  SHORT_PASSWORD:'비밀번호는 8자 이상이어야 합니다', NO_LINKED_PLAYER:'이 계정에 연결된 멤버가 없습니다',
  PLAYER_TAKEN:'그 멤버는 이미 다른 계정에 연결되어 있습니다', BAD_IMAGE:'사진 형식이 올바르지 않습니다',
  BAD_ROLE:'권한 값이 올바르지 않습니다', NOT_FOUND:'계정을 찾을 수 없습니다',
};
const errText = e => ERR_MSG[e.code] || (/fetch/i.test(e.message) ? '서버에 연결할 수 없습니다' : '오류: ' + e.message);
function handleErr(e){

/* ---------- 동기화 상태 표시 ---------- */

// 관리자가 바꾼 내용을 서버에 저장 (연달아 바꾸면 0.35초 모아서 한 번에)

async function flushSave(){
  if(saving){ saveTimer = setTimeout(flushSave, 300); return; }

  saving = true; dirty = false;
  try{
    stateVersion = await API.rpc('save_state', { p_token:session.token, p_data:db, p_version:stateVersion });
    setSync(dirty ? 'saving' : 'saved');
  }catch(e){
    dirty = false; setSync('error');
    if(e.code === 'VERSION_CONFLICT') toast('다른 관리자가 먼저 수정해서 최신 내용으로 다시 불러왔습니다. 방금 바꾼 내용을 다시 확인해 주세요', 'error');

/* ---------- 로그인 ---------- */
let loginFails = 0, lockUntil = 0;
function openLogin(){
  const m = openModal({
    title:'<i class="fa-solid fa-lock"></i> 로그인',
    body:`<label class="field">아이디<input class="input" id="lgId" type="text" autocomplete="username" autocapitalize="off" spellcheck="false"></label>
          <label class="field">비밀번호<input class="input" id="lgPw" type="password" autocomplete="current-password"></label>
          <p class="small" id="lgMsg" style="color:var(--danger);min-height:16px"></p>`,
    footer:`<button class="btn" data-x>취소</button><button class="btn btn-primary" id="lgGo"><i class="fa-solid fa-right-to-bracket"></i> 로그인</button>`
  });
  $('[data-x]', m).onclick = closeModal;
  const go = async () => {
    const msg = $('#lgMsg', m), btn = $('#lgGo', m);
    if(btn.disabled) return;
    if(Date.now() < lockUntil){ msg.textContent = `잠시 후 다시 시도하세요 (${Math.ceil((lockUntil-Date.now())/1000)}초)`; return; }
    const id = $('#lgId', m).value.trim(), pw = $('#lgPw', m).value;
    if(!id || !pw){ msg.textContent = '아이디와 비밀번호를 입력하세요.'; return; }
    btn.disabled = true; msg.textContent = '';
    try{
      const res = await API.rpc('login', { p_login:id, p_password:pw });
      setSession({ token:res.token, account:res.account }); loginFails = 0;
      closeModal(); toast(`${ROLES[res.account.role].label} 계정(${res.account.login_id})으로 로그인했습니다`); route();
    }catch(e){
      if(e.code === 'INVALID_LOGIN'){ loginFails++; if(loginFails >= 5){ lockUntil = Date.now() + 30000; loginFails = 0; } }
      msg.textContent = errText(e) + '.';
    }finally{ btn.disabled = false; }
  };
  $('#lgGo', m).onclick = go;
  $$('input', m).forEach(i => i.addEventListener('keydown', e => { if(e.key === 'Enter') go(); }));
  $('#lgId', m).focus();
}

/* ---------- 프로필 사진 (파일 업로드) ----------
   업로드한 사진은 256×256 정사각형으로 줄인 뒤 "data URL"(그림을 글자로 바꾼 것) 형태로
   Supabase의 photos 표에 저장합니다. */
const PHOTO_SIZE = 256;
function imageSrc(v){
  if(typeof v === 'string' && /^data:image\/(png|jpeg|webp|gif);base64,/.test(v)) return v;
  return safeUrl(v);   // 예전에 URL로 넣은 사진도 계속 보이게
}
function readImageFile(file){
  return new Promise((resolve, reject) => {
    if(!file.type.startsWith('image/')) return reject(new Error('이미지 파일만 올릴 수 있습니다'));
    if(file.size > 15 * 1024 * 1024) return reject(new Error('15MB 이하의 사진을 올려주세요'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const side = Math.min(img.width, img.height);               // 가운데를 정사각형으로 자르기
      const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
      const c = document.createElement('canvas'); c.width = c.height = PHOTO_SIZE;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0, 0, PHOTO_SIZE, PHOTO_SIZE);  // 투명 배경 대비
      ctx.drawImage(img, sx, sy, side, side, 0, 0, PHOTO_SIZE, PHOTO_SIZE);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('사진을 읽을 수 없습니다')); };
    img.src = url;
  });
}
// 사진 선택 칸 HTML

// 사진 선택 칸 동작 연결. 반환값의 .value 에 현재 사진이 들어 있습니다.
function bindPhotoPicker(root, id, initial, getName){

    try{ state.value = await readImageFile(f); paint(); $('[data-pp-msg]', box).textContent = `${f.name} 선택됨`; }
    catch(err){ toast(err.message, 'error'); $('[data-pp-msg]', box).textContent = 'JPG·PNG·WEBP · 자동으로 작게 줄여 저장합니다'; }
    state.busy = false;
  });
  $('[data-pp-clear]', box).onclick = () => { state.value = ''; paint(); $('[data-pp-msg]', box).textContent = '사진 없음'; };
  return state;
}

function avatar(p, size=36){
  const u = imageSrc('image' in p ? p.image : photos[p.id]), st = `width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px`;
  return u ? `<img class="avatar" style="${st}" src="${esc(u)}" alt="" onerror="this.style.visibility='hidden'">`
           : `<span class="avatar" style="${st}">${esc((p.name||'?').slice(0,1))}</span>`;
}
function chip(p, { draggable=false, showCost=true } = {}){
  return `<span class="chip" data-pid="${esc(p.id)}" ${draggable?'draggable="true"':''}>${avatar(p,24)}${esc(p.name)}${showCost?` <span class="cost">${costOf(p)}코</span>`:''}</span>`;
}

/* =====================================================================
   전적 계산
   - 우승 기록(db.records)에 등장한 횟수 = 게임 수, 1등 = 우승
   - 관리자가 개인 기록에서 직접 더한 값(bonusWins, bonusGames)을 합산
   ===================================================================== */
function memberMatches(m, p){
  if(m.pid) return m.pid === p.id;
  const n = norm(m.name);
  return !!n && (n === norm(p.name) || n === norm(p.ingame));
}
const memberName = m => (m.pid && findPlayer(m.pid)?.name) || m.name;
function playerStats(p){
  let games = 0, wins = 0, sum = 0; const hist = [];
  for(const r of db.records){
    const e = r.ranks.find(e => (e.members||[]).some(m => memberMatches(m, p)));
    if(!e) continue;
    games++; sum += e.rank; if(e.rank === 1) wins++;
    hist.push({ date:r.date, title:r.title, rank:e.rank, team:e.team, score:e.score, created:r.createdAt||0 });
  }
  const bw = p.bonusWins || 0, bg = p.bonusGames || 0;
  const totalGames = games + bg, totalWins = wins + bw;
  return {
    games: totalGames, wins: totalWins,
    rate: totalGames ? Math.min(100, totalWins / totalGames * 100) : 0,
    avg: games ? sum / games : null,         // 평균 순위는 실제 대회 기록만으로 계산
    recordGames: games, recordWins: wins,
    hist: hist.sort((a,b) => (b.date||'').localeCompare(a.date||'') || b.created - a.created),
  };
}
// 이름 → 선수 연결 (쉼표로 구분된 멤버 문자열을 해석)
function resolveMembers(text){
  return String(text||'').split(/[,，\n]/).map(s => s.trim()).filter(Boolean).map(name => {
    const p = db.players.find(p => norm(p.name) === norm(name) || (p.ingame && norm(p.ingame) === norm(name)));
    return p ? { pid:p.id, name:p.name } : { pid:null, name };
  });
}
const sortedRecords = () => [...db.records].sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.createdAt||0) - (a.createdAt||0));

/* ---------- 점수판 계산 ---------- */
function teamTotal(t){
  let s = 0;
  for(let r=1; r<=db.score.rounds; r++) s += Number(db.score.scores[t.id + '-' + r]) || 0;
  return Math.round(s * 100) / 100;
}
const scoreRanking = () => db.score.teams.map(t => ({ ...t, total:teamTotal(t) })).sort((a,b) => b.total - a.total || a.id - b.id);

async function uploadData(d){

/* ---------- 드래그 앤 드롭 공통 ---------- */
// zones: [data-drop] 속성을 가진 영역. onDrop(pid, 영역의 data-drop 값)
let dragPid = null;
function bindDnD(root, onDrop){
  $$('[draggable="true"]', root).forEach(el => {
    el.addEventListener('dragstart', e => { dragPid = el.dataset.pid; el.classList.add('dragging'); e.dataTransfer.setData('text/plain', dragPid); e.dataTransfer.effectAllowed = 'move'; });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); dragPid = null; });
  });
  $$('[data-drop]', root).forEach(z => {
    z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('drag-over'); });
    z.addEventListener('dragleave', e => { if(!z.contains(e.relatedTarget)) z.classList.remove('drag-over'); });
    z.addEventListener('drop', e => {
      e.preventDefault(); z.classList.remove('drag-over');
      const pid = e.dataTransfer.getData('text/plain') || dragPid;
      if(pid) onDrop(pid, z.dataset.drop);
    });
  });
}

      ${stat('fa-star','평균 순위', byAvg[0], x => `평균 ${x.s.avg.toFixed(2)}위`)}
      <div class="card winner-card"><div class="card-header"><span class="left"><i class="fa-solid fa-crown"></i> Last Winner</span></div>${lastWinner}</div>
      <div class="card"><div class="card-header"><span class="left"><i class="fa-solid fa-medal"></i> Top 3 Leaders</span></div>
        ${byWins.length ? byWins.slice(0,3).map((x,i) => `<div class="podium-row"><span class="podium-rank rank-${i+1}">${i+1}</span>${avatar(x.p,32)}<b style="flex:1">${esc(x.p.name)}</b><span class="stat-value" style="margin:0">${x.s.wins}승</span></div>`).join('')
          : `<p class="muted">기록 없음</p>`}
      </div>
      <div class="card"><div class="card-header"><span class="left"><i class="fa-solid fa-chart-simple"></i> 티어 분포</span><span class="small muted">${db.players.length}명</span></div>
        ${db.players.length ? (() => {

                        { t:null, n:db.players.filter(p => !tierInfo(p.tier)).length }];
          const max = Math.max(1, ...rows.map(r => r.n));

            <div class="dist-bar"><span style="width:${r.n/max*100}%;background:${r.t ? r.t.color : 'var(--text-muted)'}"></span></div>

/* =====================================================================
   [페이지 3] 팀 드래프트 (관리자)
   - 드래그 앤 드롭 또는 "선수 클릭 → 팀 클릭"으로 배치
